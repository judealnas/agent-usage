name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p agent-usage-core -p agent-usage-cli --all-targets --locked -- -D warnings
      - run: cargo test -p agent-usage-core -p agent-usage-cli --locked
      - run: cargo build -p agent-usage-cli --release --locked
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/agent-usage-window/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check-version.py
      - run: npm ci
        working-directory: apps/agent-usage-window
      - run: npm run build
        working-directory: apps/agent-usage-window
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p agent-usage-cli --release --locked
      - run: npm run tauri build -- --ci -- --locked
        working-directory: apps/agent-usage-window
