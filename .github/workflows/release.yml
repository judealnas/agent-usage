name: Release

# Pushing a tag such as v0.2.0 tests, builds, and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir dist
          asset="agent-usage-$GITHUB_REF_NAME-x86_64-windows.exe"
          cp target/release/agent-usage.exe "dist/$asset"
          cd dist
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
