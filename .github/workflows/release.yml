name: Release

# Pushing a tag such as v0.2.0 tests, builds, and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/agent-usage-window/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check shared version
        run: python scripts/check-version.py "$GITHUB_REF_NAME"
      - run: npm ci
        working-directory: apps/agent-usage-window
      - run: npm test
        working-directory: apps/agent-usage-window
      - run: npm run build
        working-directory: apps/agent-usage-window

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build -p agent-usage-cli --release --locked

      - name: Build GUI installer
        run: npm run tauri build -- --ci -- --locked
        working-directory: apps/agent-usage-window

      - name: Package
        run: |
          mkdir dist
          asset="agent-usage-cli-$GITHUB_REF_NAME-x86_64-windows.exe"
          source="agent-usage-$GITHUB_REF_NAME-source"
          cp target/release/agent-usage-cli.exe "dist/$asset"
          git archive --format=zip --prefix="agent-usage-$GITHUB_REF_NAME/" --output="dist/$source.zip" HEAD
          git archive --format=tar.gz --prefix="agent-usage-$GITHUB_REF_NAME/" --output="dist/$source.tar.gz" HEAD
          installers=(target/release/bundle/nsis/*.exe)
          test "${#installers[@]}" -eq 1 && test -f "${installers[0]}"
          cp "${installers[0]}" "dist/agent-usage-window-$GITHUB_REF_NAME-x86_64-windows-setup.exe"
          cd dist
          for file in *.exe *.zip *.tar.gz; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
