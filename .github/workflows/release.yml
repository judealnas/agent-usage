name: Release

# Pushing a tag such as v0.2.0 tests, builds, and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir dist
          asset="agent-usage-cli-$GITHUB_REF_NAME-x86_64-windows.exe"
          source="agent-usage-cli-$GITHUB_REF_NAME-source"
          cp target/release/agent-usage-cli.exe "dist/$asset"
          git archive --format=zip --prefix="agent-usage-cli-$GITHUB_REF_NAME/" --output="dist/$source.zip" HEAD
          git archive --format=tar.gz --prefix="agent-usage-cli-$GITHUB_REF_NAME/" --output="dist/$source.tar.gz" HEAD
          cd dist
          for file in "$asset" "$source.zip" "$source.tar.gz"; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
