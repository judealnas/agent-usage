[package]
name = "agent-usage-gui"
version.workspace = true
edition = "2021"
description = "An always-on-top window showing subscription usage for coding agents"
license = "MIT"

[lib]
name = "agent_usage_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-usage-core = { path = "../../../crates/agent-usage-core" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["time"] }
