[package]
name = "agent-usage-cli"
version.workspace = true
edition = "2021"
license = "MIT"
readme = "README.md"
description = "Query subscription usage for coding agents from the command line"

[dependencies]
agent-usage-core = { path = "../agent-usage-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
