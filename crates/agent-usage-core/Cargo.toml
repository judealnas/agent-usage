[package]
name = "agent-usage-core"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Shared subscription usage queries for coding agents"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "macros"] }
